{{- if .Values.ingress.enabled }}
# Only the web app is public; it calls the api inside the cluster (PSA_API_URL).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "psa.fullname" . }}
  labels:
    {{- include "psa.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ default (printf "%s-tls" (include "psa.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "psa.fullname" . }}-web
                port:
                  name: http
{{- end }}
