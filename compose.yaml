# Local stack: postgres + api + worker + web.
#   cp .env.example .env
#   docker compose --profile local up --build --wait -d
# `worker` (Story 2.2) runs the same backend image as `api` with `python -m app.main_worker`:
# it claims and runs background jobs from the Postgres queue (`platform_jobs`). It needs the
# schema migrated (README) and shares the `files` volume with the api.
# Models: api and worker reach the host's Ollama at host.docker.internal (Story 2.4); the
# `ollama` service, otel-collector and migrate of the prod topology come in later stories.
name: pre-sales-agent

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    profiles: ["local"]
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Password of the `psa_app` login role the api connects as; created by the init
      # script on first start of an empty volume (existing volumes: `down -v` once).
      PSA_APP_DB_PASSWORD: ${PSA_APP_DB_PASSWORD:?set PSA_APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Local only, bound to loopback, so host-side tests and migrations can reach it.
      - "127.0.0.1:${PSA_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    <<: *restart
    profiles: ["local"]
    build:
      context: ./backend
      args:
        PSA_VERSION: ${PSA_VERSION:-0.0.0-dev}
    environment:
      PSA_ENV: local
      # The app runs as the least-privileged `psa_app` role and never holds the owner URL.
      # Alembic gets PSA_MIGRATIONS_DATABASE_URL only on its own `exec -e ...` invocation
      # (see README) until Story 1.2's one-shot `migrate` service.
      PSA_DATABASE_URL: postgresql+psycopg://psa_app:${PSA_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PSA_LOG_LEVEL: ${PSA_LOG_LEVEL:-INFO}
      # Access tokens are validated against this tenant's JWKS and this API audience.
      PSA_AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in .env}
      PSA_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in .env}
      # Uploaded files (content-addressed blobs) live on the `files` volume.
      PSA_STORAGE_DIR: /var/lib/psa/files
      PSA_UPLOAD_MAX_BYTES: ${PSA_UPLOAD_MAX_BYTES:-52428800}
      # Host Ollama (ModelGateway, Story 2.4). The api never calls a model itself.
      PSA_OLLAMA_URL: ${PSA_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - files:/var/lib/psa/files
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PSA_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *restart
    profiles: ["local"]
    build:
      context: ./backend
      args:
        PSA_VERSION: ${PSA_VERSION:-0.0.0-dev}
    command: ["python", "-m", "app.main_worker"]
    environment:
      PSA_ENV: local
      # Same least-privileged `psa_app` role as the api.
      PSA_DATABASE_URL: postgresql+psycopg://psa_app:${PSA_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PSA_LOG_LEVEL: ${PSA_LOG_LEVEL:-INFO}
      PSA_STORAGE_DIR: /var/lib/psa/files
      PSA_WORKER_POLL_S: ${PSA_WORKER_POLL_S:-1}
      PSA_WORKER_CONCURRENCY: ${PSA_WORKER_CONCURRENCY:-1}
      PSA_JOB_LEASE_S: ${PSA_JOB_LEASE_S:-30}
      PSA_JOB_HEARTBEAT_S: ${PSA_JOB_HEARTBEAT_S:-10}
      # ModelGateway (Story 2.4): host Ollama, reached through host-gateway. `demo-chat`
      # sends prompt text to Ollama's cloud: sample or anonymised Opportunities only.
      PSA_OLLAMA_URL: ${PSA_OLLAMA_URL:-http://host.docker.internal:11434}
      PSA_MODEL_PROFILE_CHAT: ${PSA_MODEL_PROFILE_CHAT:-demo-chat}
      PSA_MODEL_SLOTS: ${PSA_MODEL_SLOTS:-1}
      PSA_MODEL_MAX_RETRIES: ${PSA_MODEL_MAX_RETRIES:-2}
      PSA_MODEL_TIMEOUT_S: ${PSA_MODEL_TIMEOUT_S:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - files:/var/lib/psa/files
    depends_on:
      postgres:
        condition: service_healthy
    # The image's HEALTHCHECK probes the api's HTTP port; the worker serves no HTTP.
    healthcheck:
      disable: true

  web:
    <<: *restart
    profiles: ["local"]
    build:
      context: ./web
      args:
        PSA_VERSION: ${PSA_VERSION:-0.0.0-dev}
    environment:
      PSA_API_URL: http://api:8000
      # Auth0 regular web application (see README "Auth0 tenant setup").
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?set AUTH0_DOMAIN in .env}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?set AUTH0_CLIENT_ID in .env}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:?set AUTH0_CLIENT_SECRET in .env}
      AUTH0_SECRET: ${AUTH0_SECRET:?set AUTH0_SECRET in .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE in .env}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PSA_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  # Uploaded Source files (platform.storage, AD-18). `down -v` deletes them.
  files:
