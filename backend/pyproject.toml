[project]
name = "psa-backend"
version = "0.1.0"
description = "Agentic AI Presales Platform backend (modular monolith: api + worker)"
requires-python = "==3.13.*"
# Versions pinned to the architecture spine Stack table; others pinned to the locked resolution.
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.54.0",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.32",
    "pypdf==6.19.0",  # BSD-3-Clause; PDF text for Source parsing (Story 2.2 Part B)
    "httpx==0.28.1",
    "openpyxl==3.1.5",  # MIT; .xlsx Estimate export (Story 8.8)
    "python-docx==1.2.0",  # MIT; .docx Estimate export (Story 8.8)
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.1.3",
    "psycopg-pool==3.3.3",  # the checkpointer's own pool (AD-6)
    "pgvector==0.4.2",  # MIT; the SQLAlchemy `vector` type for knowledge_chunks (Story 3.3)
    "pyyaml==6.0.3",  # MIT; the research allowlist (Story 5.4) and evals/ files (Story 7.6)
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "import-linter==2.15",
    "hypothesis==6.168.3",  # property-based tests of the Estimate arithmetic (Story 8.1)
    "types-openpyxl==3.1.5.20260827",  # Apache-2.0; type stubs for openpyxl (Story 8.8)
    "types-pyyaml==6.0.12.20250915",  # Apache-2.0; type stubs for pyyaml
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*"]  # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only app.orchestration may import langgraph (AD-5)"
type = "forbidden"
source_modules = ["app.modules", "app.agents", "app.platform", "app.main_api", "app.main_worker"]
forbidden_modules = ["langgraph"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Platform does not depend on business modules, orchestration or agents"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = ["app.modules", "app.orchestration", "app.agents"]

[[tool.importlinter.contracts]]
name = "The api process never imports the job claim loop (AD-1, AD-29)"
type = "forbidden"
source_modules = ["app.main_api"]
forbidden_modules = ["app.platform.jobs.runner", "app.main_worker"]

[[tool.importlinter.contracts]]
name = "The api process never calls a chat model (AD-8)"
type = "forbidden"
source_modules = ["app.main_api"]
forbidden_modules = [
    "app.platform.model_gateway.gateway",
    "app.platform.model_gateway.adapter",
    "app.platform.model_gateway.ollama",
    "app.platform.model_gateway.openai_compat",
]
# Story 3.3: `GET /knowledge/search` embeds its query (one `bge-m3` call through the gateway,
# recorded in `platform_model_calls`); the api process builds a gateway for that only and
# never makes a chat call or runs an agent.
ignore_imports = ["app.main_api -> app.platform.model_gateway.gateway"]

