name: Release

# After CI passes on main: bump the patch version (vX.Y.Z git tag), build the images,
# push them to GHCR as <version> and move the `latest` tag.
# Images: ghcr.io/<owner>/pre-sales-agent/pre-sales-agent-{api,worker,web}. No extra secrets:
# the built-in GITHUB_TOKEN pushes them (packages: write). The image source label links each
# package to this repository.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # <owner>/<repo>; must be lowercase for a registry path.
  REPOSITORY: ${{ github.repository }}
  SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          echo "version=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The worker runs the backend image with a different command, so api and worker
      # share one build and are published under both names.
      - name: Build and push api + worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: PSA_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-api:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-api:latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-worker:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-worker:latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: PSA_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-web:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-web:latest

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
