name: Release

# After CI passes on main: bump the patch version (vX.Y.Z git tag), build the images,
# push them to Nexus as <version> and move the `latest` tag.
# Required repository secrets: NEXUS_USERNAME, NEXUS_PASSWORD.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: nexus.shanilmelder.com
  REPOSITORY: pre-sales-agent

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          echo "version=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # The worker runs the backend image with a different command, so api and worker
      # share one build and are published under both names.
      - name: Build and push api + worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: PSA_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-api:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-api:latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-worker:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-worker:latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: PSA_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-web:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/pre-sales-agent-web:latest

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
