name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to main gets a verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (ruff, mypy, architecture, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: psa
          POSTGRES_PASSWORD: psa-ci
          POSTGRES_DB: psa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U psa -d psa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PSA_DATABASE_URL: postgresql+psycopg://psa:psa-ci@localhost:5432/psa
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      - name: architecture contracts (import-linter)
        run: uv run lint-imports
      - name: migrations apply
        run: uv run alembic upgrade head
      - name: pytest (includes architecture tests and DB-up health test)
        run: uv run pytest

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: compose (local stack up + health)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          sed "s/^PSA_VERSION=.*/PSA_VERSION=ci-${GITHUB_SHA::12}/" .env.example > .env
      - name: Start stack
        run: docker compose --profile local up --build --wait --wait-timeout 300 -d
      - name: API health returns 200 with build version
        run: |
          body=$(curl -fsS http://localhost:8000/api/v1/health)
          echo "$body"
          echo "$body" | jq -e --arg v "ci-${GITHUB_SHA::12}" '.status == "ok" and .db == "ok" and .version == $v'
      - name: Web healthz returns ok with build version
        run: |
          body=$(curl -fsS http://localhost:3000/healthz)
          echo "$body"
          echo "$body" | jq -e --arg v "ci-${GITHUB_SHA::12}" '.status == "ok" and .version == $v'
      - name: Migrations apply against compose Postgres
        run: docker compose --profile local exec -T api alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generated API client is up to date
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- src/lib/api
      - name: Logs on failure
        if: failure()
        run: docker compose --profile local logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile local down -v
